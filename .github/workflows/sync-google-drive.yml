name: Sync canonical documents to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - "src/content/kue/**"
      - ".github/workflows/sync-google-drive.yml"
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-drive-sync-kueper-com
  cancel-in-progress: true

jobs:
  sync:
    name: Sync kueper.com documents
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Google Drive configuration
        id: config
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        shell: bash
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "RCLONE_CONFIG is not configured yet; Drive sync is skipped."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install rclone
        if: steps.config.outputs.configured == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        if: steps.config.outputs.configured == 'true'
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        shell: bash
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd gdrive: >/dev/null

      - name: Sync canonical kueper.com documents
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          rclone sync \
            "src/content/kue" \
            "gdrive:OTA/_GITHUB/kueper.com" \
            --backup-dir "gdrive:OTA/_GITHUB/_sync-history/kueper.com/${GITHUB_RUN_ID}" \
            --max-delete 100 \
            --create-empty-src-dirs \
            --drive-skip-gdocs \
            --verbose
