<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Dione – hypothetisches Schichtenmodell</title><desc id="d">Ein wissenschaftliches Schema mit Eiskruste, hypothetischem Wasser-Ozean und Gesteinskern. Nicht maßstabsgerecht.</desc><rect width="960" height="520" rx="18" fill="#101b2c"/><text x="36" y="49" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="27" font-weight="bold">Dione: mögliches Inneres</text><text x="36" y="77" fill="#b9cadb" font-family="Arial,sans-serif" font-size="15">Modellbeispiel nach Beuthe et al. (2016) · keine direkte Ozeanmessung</text><circle cx="300" cy="278" r="180" fill="#dce9f3" stroke="#92aabd" stroke-width="4"/><circle cx="300" cy="278" r="147" fill="#307aa7"/><circle cx="300" cy="278" r="92" fill="#827263"/><circle cx="300" cy="278" r="64" fill="#685e55"/><path d="M197 130L220 155L211 174M387 118L367 145L379 160M149 242L169 253L157 271M424 325L410 340L420 360" fill="none" stroke="#a7bfcc" stroke-width="4" opacity=".85"/><line x1="430" y1="163" x2="560" y2="125" stroke="#b3cbdf" stroke-width="2"/><line x1="437" y1="310" x2="560" y2="305" stroke="#6fb8e1" stroke-width="2"/><line x1="367" y1="267" x2="560" y2="426" stroke="#ad9d8c" stroke-width="2"/><g fill="#f5f7fa" font-family="Arial,sans-serif" font-size="20"><text x="577" y="125">Eiskruste</text><text x="577" y="153" font-size="16" fill="#bed0df">99 ± 23 km (Modell)</text><text x="577" y="300">Flüssiger Ozean?</text><text x="577" y="327" font-size="16" fill="#bed0df">65 ± 30 km (Modell)</text><text x="577" y="427">Gesteinskern</text><text x="577" y="452" font-size="16" fill="#bed0df">Zusammensetzung nur modelliert</text></g><text x="36" y="496" fill="#b5c7d6" font-family="Arial,sans-serif" font-size="14">Schematisch · Radien und Schichtdicken nicht maßstabsgerecht · [T] Modell / [H] Ozeanhypothese</text></svg>